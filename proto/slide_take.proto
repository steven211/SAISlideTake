syntax = "proto3";

package saislidetake.v1;

// ============================================================================
// SAISlideTake 統一通訊契約 (gRPC / gRPC-Web / WebSocket Event Payload)
// 涵蓋簡報頁面同步、單頁分片錄音、版本卡片管理、黃金錄音挑選與全自動巡航連播
// ============================================================================

service SlideTakeService {
  // 1. 簡報頁面狀態同步與雙向控制
  rpc SyncActiveSlide (SyncActiveSlideRequest) returns (SyncActiveSlideResponse);
  rpc TriggerSlideNavigation (SlideNavigationRequest) returns (SlideNavigationResponse);

  // 2. 單頁錄音分片與版本卡片管理 (Take Cards)
  rpc ListSlideTakes (ListSlideTakesRequest) returns (ListSlideTakesResponse);
  rpc SaveSlideTake (SaveSlideTakeRequest) returns (SaveSlideTakeResponse);
  rpc SetGoldenTake (SetGoldenTakeRequest) returns (SetGoldenTakeResponse);
  rpc DeleteSlideTake (DeleteSlideTakeRequest) returns (DeleteSlideTakeResponse);

  // 3. 整份簡報黃金音軌索引與自動巡航連播 (Golden Playback Engine)
  rpc GetPresentationManifest (GetPresentationManifestRequest) returns (PresentationManifest);

  // 4. AI 語音轉寫與大綱對照分析 (STT & LLM Coach)
  rpc TranscribeTake (TranscribeTakeRequest) returns (TranscribeTakeResponse);
  rpc EvaluateSlideAlignment (EvaluateSlideAlignmentRequest) returns (EvaluateSlideAlignmentResponse);
}

// ----------------------------------------------------------------------------
// 資料模型：簡報與單頁狀態
// ----------------------------------------------------------------------------

message SyncActiveSlideRequest {
  string presentation_id = 1;
  string slide_id = 2;          // 例如: "05-005-FDE是什麼"
  int32 slide_index = 3;        // 0-based 頁碼索引
  int32 total_slides = 4;       // 總頁數
  string slide_title = 5;       // 投影片標題
}

message SyncActiveSlideResponse {
  bool success = 1;
  SlideTakeGroup current_slide_group = 2;
}

enum NavigationCommand {
  NAV_UNSPECIFIED = 0;
  NAV_NEXT_OR_REVEAL = 1;
  NAV_PREV = 2;
  NAV_GOTO_INDEX = 3;
}

message SlideNavigationRequest {
  string presentation_id = 1;
  NavigationCommand command = 2;
  int32 target_index = 3;
}

message SlideNavigationResponse {
  bool success = 1;
  string active_slide_id = 2;
  int32 active_index = 3;
}

// ----------------------------------------------------------------------------
// 資料模型：錄音版本卡片 (Take Card) 與黃金錄音 (Golden Take)
// ----------------------------------------------------------------------------

message TakeCard {
  string take_id = 1;           // 例如: "take_2"
  string slide_id = 2;          // 例如: "05-005-FDE是什麼"
  string filename = 3;          // 例如: "take_2_20261109_201830.webm"
  string relative_path = 4;     // 例如: "audio/05-005-FDE是什麼/take_2_20261109_201830.webm"
  double duration_sec = 5;      // 音訊秒數
  string created_at = 6;        // ISO-8601 時間戳記
  string note = 7;              // 講者備註 (例如: "語調沉穩、講解完整")
  bool is_golden = 8;           // 是否為當前頁黃金錄音
  string transcript = 9;        // STT 繁中逐字稿 (選填)
  repeated float waveform_peaks = 10; // 音波預覽峰值陣列
}

message SlideTakeGroup {
  string slide_id = 1;
  string slide_title = 2;
  string golden_take_id = 3;
  repeated TakeCard takes = 4;
}

message ListSlideTakesRequest {
  string presentation_id = 1;
  string slide_id = 2;
}

message ListSlideTakesResponse {
  SlideTakeGroup group = 1;
}

message SaveSlideTakeRequest {
  string presentation_id = 1;
  string slide_id = 2;
  string slide_title = 3;
  bytes audio_data = 4;
  string mime_type = 5;         // 例如: "audio/webm;codecs=opus"
  double duration_sec = 6;
  string note = 7;
  bool set_as_golden = 8;
}

message SaveSlideTakeResponse {
  bool success = 1;
  TakeCard created_take = 2;
  SlideTakeGroup updated_group = 3;
}

message SetGoldenTakeRequest {
  string presentation_id = 1;
  string slide_id = 2;
  string take_id = 3;
}

message SetGoldenTakeResponse {
  bool success = 1;
  SlideTakeGroup updated_group = 2;
}

message DeleteSlideTakeRequest {
  string presentation_id = 1;
  string slide_id = 2;
  string take_id = 3;
}

message DeleteSlideTakeResponse {
  bool success = 1;
  SlideTakeGroup updated_group = 2;
}

// ----------------------------------------------------------------------------
// 資料模型：整份簡報 Manifest 與自動連播
// ----------------------------------------------------------------------------

message GetPresentationManifestRequest {
  string presentation_id = 1;
}

message PresentationManifest {
  string presentation_id = 1;
  string presentation_root = 2;
  int32 transition_delay_ms = 3;
  map<string, SlideTakeGroup> slides = 4;
}

// ----------------------------------------------------------------------------
// 資料模型：AI 逐字稿與大綱比對
// ----------------------------------------------------------------------------

message TranscribeTakeRequest {
  string presentation_id = 1;
  string slide_id = 2;
  string take_id = 3;
}

message TranscribeTakeResponse {
  bool success = 1;
  string transcript = 2;
  double words_per_minute = 3;
}

message EvaluateSlideAlignmentRequest {
  string presentation_id = 1;
  string slide_id = 2;
  string take_id = 3;
  string slide_outline_markdown = 4;
}

message EvaluateSlideAlignmentResponse {
  bool success = 1;
  int32 alignment_score = 2;           // 0 ~ 100
  repeated string missing_key_points = 3;
  string pacing_advice = 4;
}
