[package]
name = "saist-portal"
version = "0.1.0"
edition = "2021"
description = "SAISlideTake Desktop Portal & Always-on-Top Floating Toolbar"

[[bin]]
name = "SAISlideTake"
path = "src/main.rs"

[dependencies]
saist-core = { path = "../saist-core" }
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWindow"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
